# The Codespace runs two containers: the Node workspace and Postgres.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:26
    volumes:
      - ../..:/workspaces:cached
    # keep the container running; VS Code attaches to it
    command: sleep infinity
    environment:
      # local-only database, so this password is not a secret
      DATABASE_URL: postgres://cars:cars@postgres:5432/cars
      TEST_DATABASE_URL: postgres://cars:cars@postgres:5432/cars_test
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: cars
      POSTGRES_PASSWORD: cars
      POSTGRES_DB: cars
    volumes:
      # Postgres 18 images keep their data below /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
      # runs only when the data volume is empty, i.e. on first start
      - ./create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      # over TCP: during first start, Postgres listens only on its socket
      # until create-test-database.sql has run
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cars -d cars"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
