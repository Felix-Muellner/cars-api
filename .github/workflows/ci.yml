name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # same image as the devcontainer; CI only needs the test database
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cars
          POSTGRES_PASSWORD: cars
          POSTGRES_DB: cars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cars -d cars_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # throwaway CI database, so this password is not a secret
      TEST_DATABASE_URL: postgres://cars:cars@localhost:5432/cars_test
    steps:
      - uses: actions/checkout@v7
        with:
          # full history, so the migration check can compare with main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:migrations
      - run: npm run check

  # builds the Docker image and checks that it starts and answers
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # waits until the api health check passes (db and migrate start first)
      - run: docker compose up --detach --build --wait api
      - run: curl --fail --silent --show-error http://localhost:3000/health
      - run: curl --fail --silent --show-error http://localhost:3000/api/cars
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
